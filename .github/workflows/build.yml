name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions画面から手動実行できるようにする

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest には Android SDK がプリインストール済み（ANDROID_HOME 設定済み）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" dist/SplitLauncher.apk
          for n in 1 2 3 4 5; do
            cp "$(find slot/build/outputs/apk/slot${n} -name '*.apk' | head -1)" dist/Split${n}.apk
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SplitLauncher-debug
          path: dist/*.apk
          if-no-files-found: error
