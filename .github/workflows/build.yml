name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions画面から手動実行できるようにする

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest には Android SDK がプリインストール済み（ANDROID_HOME 設定済み）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
